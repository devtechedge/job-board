name: crawl

on:
  schedule:
    - cron: "20 13 * * *"
    - cron: "20 1 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Crawl shard 0
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          test -n "$APP_URL"
          for shard in 0 1 2 3; do
            curl -fsS -X POST "$APP_URL/api/cron/crawl?shard=$shard&of=4" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 25
            sleep 2
          done

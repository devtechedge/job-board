name: crawl

on:
  schedule:
    - cron: "20 1 * * *"
    - cron: "20 7 * * *"
    - cron: "20 13 * * *"
    - cron: "20 19 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Crawl shards
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          OF=8
          for shard in 0 1 2 3 4 5 6 7; do
            echo "shard $shard of $OF"
            curl -fsS -X POST "$APP_URL/api/cron/crawl?shard=$shard&of=$OF" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 55 \
              -o "/tmp/crawl-$shard.json"
            python3 -c "import json; d=json.load(open('/tmp/crawl-$shard.json')); print(d.get('companiesOk'), d.get('companiesFail'), d.get('jobsUpserted'), d.get('jobsClosed')); raise SystemExit(1 if int(d.get('companiesFail') or 0) else 0)"
            sleep 2
          done
